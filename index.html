<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dog Feeder</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #22201c; --muted: #7a756b;
    --accent: #2f7d4f; --accent-text: #ffffff; --warn: #b4531a; --warn-bg: #fdf0e4;
    --ok-bg: #e6f3ea; --border: #e4e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17160f; --card: #23211a; --text: #f0ede4; --muted: #9a9587;
      --accent: #4caf78; --accent-text: #0e1a12; --warn: #f0a266; --warn-bg: #3a2818;
      --ok-bg: #1d3325; --border: #38352b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 460px; padding: 20px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 8px 0 18px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
  }
  .status { text-align: center; }
  .status .emoji { font-size: 3rem; line-height: 1; }
  .status .big { font-size: 1.5rem; font-weight: 700; margin: 8px 0 2px; }
  .status .small { color: var(--muted); font-size: .95rem; }
  .status.fed { background: var(--ok-bg); }
  .status.hungry { background: var(--warn-bg); }
  .warn {
    background: var(--warn-bg); color: var(--warn);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600;
  }
  label.section { display: block; font-size: .85rem; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    border: 1.5px solid var(--border); background: transparent; color: var(--text);
    border-radius: 999px; padding: 9px 16px; font-size: 1rem; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary {
    width: 100%; border: 0; border-radius: 14px; padding: 18px;
    background: var(--accent); color: var(--accent-text);
    font-size: 1.15rem; font-weight: 700; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.primary.caution { background: var(--warn); color: #fff; }
  input[type=password] {
    width: 100%; padding: 14px; font-size: 1rem; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 12px;
  }
  .error { color: var(--warn); margin: 0 0 12px; min-height: 1.2em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .95rem;
  }
  li:last-child { border-bottom: 0; }
  li .when { color: var(--muted); font-size: .85rem; }
  li button {
    background: none; border: 0; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 999px;
    font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .logout { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">🐶 Dog Feeder</h1>

  <!-- LOGIN -->
  <section id="login" class="card hidden">
    <label class="section" for="pw">Family password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <p id="loginError" class="error"></p>
    <button id="loginBtn" class="primary">Unlock</button>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <section id="status" class="card status">
      <div class="emoji" id="statusEmoji">🍖</div>
      <div class="big" id="statusBig">Loading…</div>
      <div class="small" id="statusSmall"></div>
    </section>

    <section class="card">
      <div id="warnBox" class="warn hidden"></div>
      <label class="section">Who's feeding?</label>
      <div id="chips" class="chips"></div>
      <button id="feedBtn" class="primary">I just fed the dog</button>
    </section>

    <section class="card">
      <label class="section">Recent feedings</label>
      <ul id="history"></ul>
    </section>

    <div style="text-align:center">
      <button id="logoutBtn" class="logout">Lock this device</button>
    </div>
  </div>
</main>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ SETTINGS: edit these ============
const CONFIG = {
  SUPABASE_URL: "https://lnwygfofqnanrxxynvci.supabase.co/rest/v1",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud3lnZm9mcW5hbnJ4eHludmNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjk5NTEsImV4cCI6MjEwNTkwNTk1MX0.hu69a-vCW4Af_R7Q-P3BK2mQU7BIEAn__0Zww6QxxQM",
  FAMILY_EMAIL: "marcel.vermes6@icloud.com",      // the one shared account you create in Supabase
  DOG_NAME: "Max",
  FAMILY: ["Mom", "Dad", "Marcel", "Marvin"],   // names shown as buttons
  WARN_WITHIN_HOURS: 5,                    // warn if fed more recently than this
};
// ==============================================

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);

// Opened via the NFC tag? (tag URL ends in #feed). Remember it, then clean the URL
// so a page refresh doesn't trigger the prompt again.
let openedViaTag = location.hash === "#feed";
history.replaceState(null, "", location.pathname + location.search);

let feedings = [];
let selectedName = localStorage.getItem("feeder_name") || "";

document.title = CONFIG.DOG_NAME + " Feeder";
$("title").textContent = "🐶 " + CONFIG.DOG_NAME;
$("feedBtn").textContent = "I just fed " + CONFIG.DOG_NAME;

// ---------- helpers ----------
function timeAgo(date) {
  const mins = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return h + "h " + (m ? m + "m " : "") + "ago";
  const d = Math.floor(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}
function clock(date) {
  return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function dayLabel(date) {
  const today = new Date().toDateString();
  const yest = new Date(Date.now() - 864e5).toDateString();
  if (date.toDateString() === today) return "Today";
  if (date.toDateString() === yest) return "Yesterday";
  return date.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
function isRecent(f) {
  return f && Date.now() - new Date(f.fed_at).getTime() < CONFIG.WARN_WITHIN_HOURS * 3600 * 1000;
}

// ---------- rendering ----------
function render() {
  const last = feedings[0];
  const status = $("status");
  const todayCount = feedings.filter(f => new Date(f.fed_at).toDateString() === new Date().toDateString()).length;

  if (!last) {
    status.className = "card status hungry";
    $("statusEmoji").textContent = "🍖";
    $("statusBig").textContent = "No feedings logged yet";
    $("statusSmall").textContent = "";
  } else {
    const when = new Date(last.fed_at);
    const recent = isRecent(last);
    status.className = "card status " + (recent ? "fed" : "hungry");
    $("statusEmoji").textContent = recent ? "✅" : "🍖";
    $("statusBig").textContent = "Fed " + timeAgo(when);
    $("statusSmall").textContent =
      "by " + last.fed_by + " at " + clock(when) + " · " + todayCount + "× today";
  }

  // name chips
  const chips = $("chips");
  chips.textContent = "";
  CONFIG.FAMILY.forEach((name) => {
    const b = document.createElement("button");
    b.className = "chip" + (name === selectedName ? " on" : "");
    b.textContent = name;
    b.onclick = () => {
      selectedName = name;
      localStorage.setItem("feeder_name", name);
      render();
    };
    chips.appendChild(b);
  });

  // warning + button state
  const warn = $("warnBox");
  const btn = $("feedBtn");
  if (isRecent(last)) {
    warn.classList.remove("hidden");
    warn.textContent = "⚠️ " + CONFIG.DOG_NAME + " was already fed " + timeAgo(new Date(last.fed_at)) + " by " + last.fed_by + ".";
    btn.classList.add("caution");
    btn.textContent = "Log another feeding anyway";
  } else {
    warn.classList.add("hidden");
    btn.classList.remove("caution");
    btn.textContent = "I just fed " + CONFIG.DOG_NAME;
  }
  btn.disabled = !selectedName;

  // history
  const ul = $("history");
  ul.textContent = "";
  if (!feedings.length) {
    const li = document.createElement("li");
    li.textContent = "Nothing yet.";
    ul.appendChild(li);
  }
  feedings.slice(0, 12).forEach((f) => {
    const d = new Date(f.fed_at);
    const li = document.createElement("li");
    const left = document.createElement("div");
    left.textContent = f.fed_by;
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = dayLabel(d) + ", " + clock(d);
    left.appendChild(when);
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "Delete this entry";
    del.onclick = () => removeFeeding(f.id);
    li.appendChild(left);
    li.appendChild(del);
    ul.appendChild(li);
  });
}

// ---------- data ----------
async function loadFeedings() {
  const { data, error } = await sb.from("feedings").select("*").order("fed_at", { ascending: false }).limit(30);
  if (error) { toast("Couldn't load: " + error.message); return; }
  feedings = data;
  render();
}
async function logFeeding() {
  if (!selectedName) return;
  $("feedBtn").disabled = true;
  const { error } = await sb.from("feedings").insert({ fed_by: selectedName });
  if (error) { toast("Couldn't save: " + error.message); $("feedBtn").disabled = false; return; }
  toast("Logged! Thanks, " + selectedName + " 🐾");
  await loadFeedings();
}
async function removeFeeding(id) {
  if (!confirm("Delete this entry?")) return;
  const { error } = await sb.from("feedings").delete().eq("id", id);
  if (error) { toast("Couldn't delete: " + error.message); return; }
  await loadFeedings();
}

// ---------- auth ----------
function showLogin() {
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}
async function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  await loadFeedings();
  if (openedViaTag) {
    openedViaTag = false;
    // Scroll to the feed button so the tap-and-confirm flow is one thumb-press away
    $("feedBtn").scrollIntoView({ block: "center" });
  }
}
async function login() {
  $("loginError").textContent = "";
  $("loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: CONFIG.FAMILY_EMAIL,
    password: $("pw").value,
  });
  $("loginBtn").disabled = false;
  if (error) {
    console.error(error);
    $("loginError").textContent = error.message === "Invalid login credentials"
      ? "Invalid login. Check the password AND that FAMILY_EMAIL in index.html matches the Supabase user's email exactly."
      : "Login failed: " + error.message;
    return;
  }
  $("pw").value = "";
  showApp();
}

$("loginBtn").onclick = login;
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("feedBtn").onclick = logFeeding;
$("logoutBtn").onclick = async () => { await sb.auth.signOut(); showLogin(); };

// keep the status fresh
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !$("app").classList.contains("hidden")) loadFeedings();
});
setInterval(() => { if (!document.hidden && !$("app").classList.contains("hidden")) render(); }, 60000);

(async function init() {
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
})();
</script>
</body>
</html>
